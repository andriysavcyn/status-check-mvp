<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Check MVP</title>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; display: flex; gap: 20px; }
        .sidebar { width: 300px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); height: fit-content; }
        #calendar { flex-grow: 1; max-width: 900px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .fc-event { cursor: pointer; }
    </style>
</head>
<body>

    <div style="flex-grow: 1;"> <div style="background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: flex; gap: 15px; align-items: flex-end;">
            <div class="form-group" style="margin-bottom: 0;">
                <label>Фільтр за проєктом:</label>
                <input type="text" id="filter-project" placeholder="Назва проєкту">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label>ID перевіряючого:</label>
                <input type="number" id="filter-checker" placeholder="ID (напр. 1)">
            </div>
            <button type="button" id="applyFiltersBtn" style="width: auto;">Застосувати фільтри</button>
        </div>

        <div id='calendar'></div>
    </div>

    <div class="sidebar">
        <h3>Новий комітмент</h3>

        <div style="background: #e3f2fd; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #90caf9;">
            <h4 style="margin-top: 0;">✨ Розумне додавання (Grok AI)</h4>
            <textarea id="smart-text" placeholder="Напр: Треба зробити фінансову модель для стартапу до наступного вівторка, відповідальний Андрій" rows="3" style="width: 100%; box-sizing: border-box; padding: 8px;"></textarea>
            <button type="button" id="smartAddBtn" style="background-color: #28a745; margin-top: 10px;">Згенерувати форму</button>
        </div>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <form id="commitmentForm">
            <div class="form-group">
                <label>Назва (Title):</label>
                <input type="text" id="title" required>
            </div>
            <div class="form-group">
                <label>Проєкт:</label>
                <input type="text" id="project" required>
            </div>
            <div class="form-group">
                <label>Виконавець (Executor):</label>
                <input type="text" id="executor" required>
            </div>
            <div class="form-group">
                <label>Дедлайн:</label>
                <input type="datetime-local" id="deadline" required>
            </div>
            <div class="form-group">
                <label>Опис:</label>
                <textarea id="description"></textarea>
            </div>
            <button type="submit">Додати в календар</button>
        </form>
    </div>

    <div id='calendar'></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            
            // Ініціалізація календаря
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek'
                },
                events: async function(info, successCallback, failureCallback) {
                    try {
                        // Зчитуємо значення з полів фільтрів
                        const projectFilter = document.getElementById('filter-project').value;
                        const checkerFilter = document.getElementById('filter-checker').value;
                        
                        // Формуємо URL з параметрами
                        let url = '/commitments/?';
                        if (projectFilter) url += `project=${encodeURIComponent(projectFilter)}&`;
                        if (checkerFilter) url += `checker_id=${encodeURIComponent(checkerFilter)}&`;

                        const response = await fetch(url);
                        const data = await response.json();
                        const calendarEvents = data.map(item => ({
                            id: item.id,
                            title: `[${item.status}] ${item.title}`,
                            start: item.deadline,
                            extendedProps: { project: item.project, executor: item.executor_name, description: item.description }
                        }));
                        successCallback(calendarEvents);
                    } catch (error) {
                        console.error('Помилка завантаження:', error);
                        failureCallback(error);
                    }
                },
                eventClick: function(info) {
                    alert(`Проєкт: ${info.event.extendedProps.project}\nВиконавець: ${info.event.extendedProps.executor}\nОпис: ${info.event.extendedProps.description}`);
                }
            });
            calendar.render();

            // Обробка розумного додавання через Grok
            document.getElementById('smartAddBtn').addEventListener('click', async function() {
                const text = document.getElementById('smart-text').value;
                if (!text) return alert("Введіть текст задачі!");

                const btn = this;
                btn.innerText = "Генерація...";
                btn.disabled = true;

                try {
                    const response = await fetch('/parse-text/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: text })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        
                        // Автоматично заповнюємо форму
                        document.getElementById('title').value = data.title || "";
                        document.getElementById('project').value = data.project || "";
                        document.getElementById('executor').value = data.executor_name || "";
                        
                        if (data.deadline) {
                            // Браузер очікує формат YYYY-MM-DDTHH:MM
                            document.getElementById('deadline').value = data.deadline.slice(0, 16);
                        }
                        
                        alert("✨ Форму заповнено через Grok AI! Перевір дані та натисни синю кнопку 'Додати в календар'.");
                    } else {
                        const err = await response.json();
                        alert("Помилка AI: " + err.detail);
                    }
                } catch (error) {
                    console.error("Помилка:", error);
                    alert("Помилка з'єднання з бекендом.");
                } finally {
                    btn.innerText = "Згенерувати форму";
                    btn.disabled = false;
                }
            });

            // Обробка відправки форми
            document.getElementById('commitmentForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                // Збираємо дані. Оскільки авторизації ще немає, ставимо заглушки для id авторів
                const newCommitment = {
                    title: document.getElementById('title').value,
                    project: document.getElementById('project').value,
                    executor_name: document.getElementById('executor').value,
                    deadline: document.getElementById('deadline').value + ":00.000Z", // Форматуємо для бекенду
                    description: document.getElementById('description').value,
                    author_id: 1,  
                    checker_id: 1
                };

                try {
                    const response = await fetch('/commitments/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newCommitment)
                    });

                    if (response.ok) {
                        alert('Комітмент успішно додано!');
                        this.reset(); // Очищаємо форму
                        calendar.refetchEvents(); // Оновлюємо календар без перезавантаження сторінки
                    } else {
                        const err = await response.json();
                        alert('Помилка: ' + JSON.stringify(err));
                    }
                } catch (error) {
                    console.error('Помилка відправки:', error);
                }
            });
        });
        document.getElementById('applyFiltersBtn').addEventListener('click', function() {
                calendar.refetchEvents(); // Примушуємо календар перезавантажити події з новими параметрами URL
            });
    </script>
</body>
</html>
